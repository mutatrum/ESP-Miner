@if (form) {
  <form [formGroup]="form">
    <div class="card">
      <div class="grid grid-cols-12 gap-4 items-center mb-4">
        <label for="hostname" class="col-span-12 md:col-span-2 md:m-0">
          <tooltip-text-icon
            text="Hostname"
            tooltip="Name of the device on your local network"
            />
        </label>
        <div class="col-span-12 md:col-span-10">
          <input id="hostname" type="text" formControlName="hostname" 
            class="w-full bg-neutral-900 border border-neutral-800 text-white rounded-sm px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary" />
        </div>
      </div>
      <div class="grid grid-cols-12 gap-4 items-center mb-4">
        <label for="ssid" class="col-span-12 md:col-span-2 md:m-0">Wi-Fi SSID</label>
        <div class="col-span-12 md:col-span-10 flex gap-2 items-center">
          <input id="ssid" type="text" formControlName="ssid" class="grow bg-neutral-900 border border-neutral-800 text-white rounded-sm px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary" />
          <button
            type="button"
            class="flex items-center justify-center p-2.5 rounded-sm border border-neutral-800 bg-neutral-900/50 hover:bg-neutral-800 text-white transition-all duration-200 focus:outline-none focus:ring-1 focus:ring-primary disabled:opacity-50"
            (click)="scanWifi()"
            [disabled]="scanning"
            title="Scan Wi-Fi"
          >
            <i class="pi {{ scanning ? 'pi-spinner pi-spin' : 'pi-search' }} text-sm"></i>
          </button>
        </div>
      </div>
      <div class="grid grid-cols-12 gap-4 items-center mb-4">
        <label for="wifiPass" class="col-span-12 md:col-span-2 md:m-0">Wi-Fi Password</label>
        <div class="col-span-12 md:col-span-10">
          <div class="relative w-full flex items-center">
            <input id="wifiPass" formControlName="wifiPass"
              [type]="showWifiPassword ? 'text' : 'password'"
              placeholder="Enter Wi-Fi password" 
              class="w-full bg-neutral-900 border border-neutral-800 text-white rounded-sm pl-3 pr-10 py-2 focus:outline-none focus:ring-1 focus:ring-primary" />
            @if (form.get('wifiPass')?.dirty) {
              <span (click)="toggleWifiPasswordVisibility()"
                    class="absolute right-3 text-neutral-400 hover:text-white cursor-pointer select-none">
                <i class="pi {{!showWifiPassword ? 'pi-eye' : 'pi-eye-slash'}}"></i>
              </span>
            }
          </div>
        </div>
      </div>
      <div class="flex mt-5 gap-3">
        <button [disabled]="!form.dirty || form.invalid" (click)="updateSystem()"
          class="px-5 py-2 bg-primary text-white font-medium rounded-sm hover:bg-opacity-90 transition-all duration-200 disabled:opacity-50 text-sm">
          Save
        </button>
        <button [disabled]="!savedChanges" (click)="restart()"
          class="px-5 py-2 bg-neutral-800 hover:bg-neutral-700 text-white font-medium rounded-sm transition-all duration-200 disabled:opacity-50 text-sm">
          Restart
        </button>
      </div>
    </div>
  </form>
}
