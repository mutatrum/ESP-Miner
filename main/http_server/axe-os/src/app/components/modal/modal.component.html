@if (isVisible) {
  <div class="modal-backdrop" (click)="closable ? isVisible = false : null"></div>
  <div class="modal card">
    <header class="flex justify-between items-center p-3 pb-5">
      <h2 class="m-0">{{headline}}</h2>
      @if (closable) {
        <button (click)="isVisible = false" class="text-neutral-400 hover:text-white transition-colors duration-200 focus:outline-none">
          <i class="pi pi-times text-lg"></i>
        </button>
      }
    </header>
    <main class="overflow-y-auto flex-1 p-0 px-3">
      <ng-content></ng-content>
    </main>
  </div>
}
