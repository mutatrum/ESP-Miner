@if (form != null) {
  <div class="card">
    <form [formGroup]="form">
      <div class="flex justify-between flex-col gap-4 md:items-center md:flex-row mb-4">
        <h2 class="mb-0">
          Realtime Logs
        </h2>
        <nav class="flex gap-3 w-full md:w-1/2 items-center">
          <div class="relative w-full flex items-center">
            <span class="absolute left-3 text-neutral-500">
              <i class="pi pi-filter"></i>
            </span>
            <input
              type="text"
              class="w-full bg-neutral-900 border border-neutral-800 text-white rounded-sm pl-9 pr-4 py-2 focus:outline-none focus:ring-1 focus:ring-primary placeholder-neutral-500"
              autocomplete="off"
              placeholder="Case-sensitive filter"
              id="filter"
              formControlName="filter"/>
          </div>
          <button
            type="button"
            class="flex items-center justify-center p-2.5 rounded-sm border border-neutral-800 bg-neutral-900/50 hover:bg-neutral-800 text-white transition-all duration-200 focus:outline-none focus:ring-1 focus:ring-primary"
            (click)="stopScroll = !stopScroll"
            [title]="(stopScroll ? 'Start' : 'Stop') + ' Scrolling'">
            <i class="pi pi-{{stopScroll ? 'play' : 'pause'}} text-sm"></i>
          </button>
          <button
            type="button"
            class="flex items-center justify-center p-2.5 rounded-sm border border-neutral-800 bg-neutral-900/50 hover:bg-neutral-800 text-white transition-all duration-200 focus:outline-none focus:ring-1 focus:ring-primary disabled:opacity-50"
            [disabled]="loadingLogs"
            (click)="downloadLogs()"
            title="Download Logs">
            <i class="pi pi-{{loadingLogs ? 'spinner pi-spin' : 'download'}} text-sm"></i>
          </button>
          <button
            type="button"
            class="flex items-center justify-center p-2.5 rounded-sm border border-neutral-800 bg-neutral-900/50 hover:bg-neutral-800 text-white transition-all duration-200 focus:outline-none focus:ring-1 focus:ring-primary"
            (click)="clearLogs()"
            title="Clear Logs">
            <i class="pi pi-trash text-sm"></i>
          </button>
        </nav>
      </div>
      <div id="logs" #scrollContainer>
        @for (log of logs; track log.text) {
          <div [ngClass]="log.className">₿ {{log.text | ANSI}}</div>
        }
      </div>
    </form>
  </div>
}
