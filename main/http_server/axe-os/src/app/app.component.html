<div class="body" [class.layout-full-width]="layoutService.isWideView()">
    <div class="content">
        <router-outlet></router-outlet>
    </div>
    <app-snowflakes></app-snowflakes>
</div>

<!-- Custom Toast Notification Container -->
<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-start gap-3 p-4 rounded-xl shadow-lg border text-white transition-all duration-300 transform translate-y-0 scale-100"
      [ngClass]="{
        'bg-emerald-950/95 border-emerald-800/50 text-emerald-100': toast.type === 'success',
        'bg-red-950/95 border-red-800/50 text-red-100': toast.type === 'error',
        'bg-amber-950/95 border-amber-800/50 text-amber-100': toast.type === 'warning',
        'bg-blue-950/95 border-blue-800/50 text-blue-100': toast.type === 'info'
      }"
    >
      <div class="flex-grow">
        @if (toast.title) {
          <h4 class="font-bold text-sm mb-0.5 leading-snug">{{ toast.title }}</h4>
        }
        <p class="text-xs font-sans leading-relaxed">{{ toast.message }}</p>
      </div>
      <button (click)="toastService.remove(toast.id)" class="text-white/60 hover:text-white transition-colors duration-200 focus:outline-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  }
</div>
